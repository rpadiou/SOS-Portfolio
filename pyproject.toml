[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sos-portfolio"
version = "2.0.0"
description = "Global optimisation of degree-4 portfolio risk polynomials via the Lasserre moment-SOS hierarchy, dense and correlatively sparse."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "cvxpy>=1.4",
    "clarabel>=0.7",
    "scs>=3.2",
    "matplotlib>=3.7",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
data = ["pandas>=2.0", "scikit-learn>=1.3", "pyarrow>=14", "yfinance>=0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: takes more than ~20 s; excluded by default (run with -m slow)"]
