[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sos-portfolio"
version = "2.1.0"
description = "Global optimisation of degree-4 portfolio risk polynomials via the Lasserre moment-SOS hierarchy, dense and correlatively sparse."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.11,<2",
    "cvxpy>=1.4,<2",
    "clarabel>=0.7,<1",
    "scs>=3.2,<4",
    "matplotlib>=3.7,<4",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<10"]
data = ["pandas>=2.0,<4", "scikit-learn>=1.3,<2", "pyarrow>=14,<26", "yfinance>=0.2,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: takes more than ~20 s; excluded by default (run with -m slow)"]
